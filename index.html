<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Civi-Snap — Report it. Track it. Get it fixed.</title>
  <meta name="description" content="Civi-Snap lets citizens report potholes, garbage and broken streetlights with a photo and GPS, verify fixes with their neighbours, and hold the city to public service-level deadlines." />
  <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Apply the saved / system theme before first paint (prevents a light flash in dark mode).
    (function () {
      try {
        var pref = localStorage.getItem('civic_theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
